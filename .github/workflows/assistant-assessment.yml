name: offline assistant assessment
on:
  pull_request:
  push:
    branches: [codex/assistant-assessment-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-assessment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: |
          python -m pip install pytest==9.1.1
          python -m pip install --no-deps -e .
      - name: Evaluate label-blind baseline and independent negative controls
        run: |
          quant-assistant-eval export --cases benchmarks/assistant-v1/public/cases.json --output candidate-packet.json
          quant-assistant-eval baseline --cases candidate-packet.json --output baseline-submission.json
          quant-assistant-eval score --cases candidate-packet.json --labels benchmarks/assistant-v1/evaluator/labels.json --submission baseline-submission.json --output baseline-assessment
          quant-assistant-eval self-test --suite benchmarks/assistant-v1 --output regression-assessment
          python -m pytest -q tests/test_assistant_assessment.py --junitxml=assessment-tests.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: offline-assessment-evidence
          path: |
            candidate-packet.json
            baseline-submission.json
            baseline-assessment/
            regression-assessment/
            assessment-tests.xml
