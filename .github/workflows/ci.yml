name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the locked environment
        run: |
          python -m pip install --no-deps -r requirements.lock
          python -m pip check
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Full test suite with branch coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch --source=quant_agent -m pytest -q
          python -m coverage report --show-missing --fail-under=80
          python -m coverage json -o coverage-full.json

      - name: Artifact-consumption pure branch gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("coverage-full.json").read_text(encoding="utf-8"))
          expected = "src/quant_agent/adapters/standard.py"
          entry = next(
              (
                  value
                  for key, value in report["files"].items()
                  if key.replace("\\", "/") == expected
              ),
              None,
          )
          if entry is None:
              raise SystemExit("artifact-consumption core is missing from coverage JSON")
          summary = entry["summary"]
          covered = summary["covered_branches"]
          total = summary["num_branches"]
          if total == 0:
              raise SystemExit("artifact-consumption core has no measured branches")
          ratio = covered / total
          print(f"artifact-consumption pure branches: {covered}/{total}={ratio:.2%}")
          if ratio < 0.90:
              raise SystemExit("artifact-consumption pure branch coverage is below 90%")
          PY

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage-*.json
