[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-agent"
version = "0.3.0"
description = "LangGraph review layer for PureSaber quant framework runs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "quant-lab @ git+https://github.com/PureSaber/quant-lab.git@v0.3.0",
]

[project.optional-dependencies]
llm = ["langchain-openai>=0.3"]
workspace = ["quant-workspace @ git+https://github.com/PureSaber/quant-workspace.git"]
dev = ["pytest>=7.4", "ruff>=0.9.0"]

[project.scripts]
quant-review = "quant_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
