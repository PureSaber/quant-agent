[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-agent"
version = "0.3.2"
description = "LangGraph review layer for PureSaber quant framework runs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "pandas>=2.0,<3.0",
    "pyyaml>=6.0",
    "quant-factors @ git+https://github.com/PureSaber/quant-factors.git@482e184b4b9b66b47c7528b6cc01cf3077ce78d3",
    "tomli>=2.0; python_version < '3.11'",
    "quant-lab @ git+https://github.com/PureSaber/quant-lab.git@6ad789442a5ff7b5e3f68d241ecf0ee327f7e82f",
    "quant-workspace @ git+https://github.com/PureSaber/quant-workspace.git@v0.3.1",
]

[project.optional-dependencies]
llm = ["langchain-openai>=0.3"]
workspace = []
dev = ["coverage>=7.6", "pytest>=7.4", "ruff>=0.9.0"]

[project.scripts]
quant-review = "quant_agent.cli:main"
quant-propose = "quant_agent.research_assistant:main"
quant-research-history = "quant_agent.research_history:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]

[tool.coverage.run]
branch = true
source = ["quant_agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.quant-workspace]
layer = "orchestration"
schemas = [
    { id = "standard/v2", version = "2.0.0" },
]
lock-files = ["requirements.lock"]

[tool.ruff]
line-length = 100
target-version = "py310"
