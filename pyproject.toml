[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-agent"
version = "0.3.2"
description = "LangGraph review layer for PureSaber quant framework runs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "langgraph>=1.2.12",
    "langchain-core>=1.6.4",
    "pandas>=2.3.3,<3.0",
    "pyyaml>=6.0.3",
    "quant-factors @ git+https://github.com/PureSaber/quant-factors.git@249fb621d4d880942cb5dfbbcd812c0d45bf45a2",
    "tomli>=2.0; python_version < '3.11'",
    "quant-lab @ git+https://github.com/PureSaber/quant-lab.git@a923a791315312a4d9caecf3b9776f08d53bb736",
    "quant-workspace @ git+https://github.com/PureSaber/quant-workspace.git@v0.3.1",
]

[project.optional-dependencies]
llm = ["langchain-openai>=1.6.5"]
workspace = []
dev = ["coverage>=7.16.1", "pytest>=9.1.1", "ruff>=0.16.8"]

[project.scripts]
quant-review = "quant_agent.cli:main"
quant-propose = "quant_agent.research_assistant:main"
quant-research-history = "quant_agent.research_history:main"
quant-objective-review = "quant_agent.objective_review:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]

[tool.coverage.run]
branch = true
source = ["quant_agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.quant-workspace]
layer = "orchestration"
schemas = [
    { id = "standard/v2", version = "2.0.0" },
]
lock-files = ["requirements.lock"]

[tool.ruff]
line-length = 100
target-version = "py310"
